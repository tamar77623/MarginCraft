<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>MarginCraft</title>
</head>
<body class="bg-gradient-to-br from-green-950 via-green-900 to-emerald-950 m-0 p-0 min-h-screen flex items-center justify-center">
    <div class="bg-gradient-to-br from-green-800 to-green-900 p-8 rounded-3xl shadow-2xl border border-green-700 w-[90%] max-w-md" id="contanier">
        <input type="number" class="bg-slate-100 text-slate-900 p-3 font-semibold placeholder:font-normal placeholder:text-slate-500 block mx-auto my-5 rounded-xl w-full box-border outline-none border-2 border-transparent focus:border-green-400 focus:ring-4 focus:ring-green-500/20 transition duration-300" id="inp1" placeholder="Product purchase/production cost">
        <input type="number" class="bg-slate-100 text-slate-900 p-3 font-semibold placeholder:font-normal placeholder:text-slate-500 block mx-auto my-5 rounded-xl w-full box-border outline-none border-2 border-transparent focus:border-green-400 focus:ring-4 focus:ring-green-500/20 transition duration-300" id="inp2" placeholder="Selling price to customer">
        <button id="btn" class="block w-full bg-gradient-to-r from-green-400 to-emerald-500 text-green-950 mx-auto mt-6 p-3 rounded-xl font-bold shadow-lg shadow-green-950/30 hover:from-green-300 hover:to-emerald-400 hover:shadow-xl hover:-translate-y-1 active:translate-y-0 transition-all duration-300 cursor-pointer">Calculate the profit</button>
        <h3 id="h3" class="text-center font-bold text-green-100 m-4 text-xl capitalize"></h3>
        <span id="span1" class="text-center font-bold text-green-200 m-4 text-xl capitalize block"></span>
        <span id="span2" class="text-center font-bold text-green-200 m-4 text-xl capitalize block"></span>
        <span id="span3" class="text-center font-bold text-green-200 m-4 text-xl capitalize block"></span>
        <span id="span4" class="text-center font-bold text-green-200 m-4 text-xl capitalize block"></span>
        <button id="btn2" class="hidden w-full bg-gradient-to-r from-green-400 to-emerald-500 text-green-950 mx-auto mt-6 p-3 rounded-xl font-bold shadow-lg shadow-green-950/30 hover:from-green-300 hover:to-emerald-400 hover:shadow-xl hover:-translate-y-1 active:translate-y-0 transition-all duration-300 cursor-pointer">Clear Result</button>
    </div>
</body>
<script src="main.js"></script>
</html>
